<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala de Jantares</title>
<meta name="description" content="Escala de jantares da família e ementa de cada dia.">
<meta name="theme-color" content="#F6F7F3">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jantares">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="gate" id="gate" hidden></div>

<div class="gate" id="unconfigured" hidden></div>

<div class="wrap" id="app-wrap" hidden>

  <header class="top">
    <div>
      <h1 class="title">Escala de jantares</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="head-status">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <p class="session" id="session"></p>
    </div>
  </header>

  <nav class="tabs" aria-label="Vistas">
    <button class="tab" id="tab-escala" aria-selected="true">Escala</button>
    <button class="tab" id="tab-compras" aria-selected="false">Lista de compras</button>
  </nav>

  <div id="view-escala">

    <nav class="people" id="people" aria-label="Filtrar por cozinheiro"></nav>

    <main id="weeks"></main>

    <footer class="foot">
      <div class="foot-actions">
        <button class="copy" id="copy">Copiar escala para o grupo</button>
        <button class="admin-btn" id="admin-open">Administração</button>
      </div>
      <p class="note" id="mode-note"></p>
    </footer>

  </div>

  <div id="view-compras" hidden>

    <form class="shop-create" id="shop-create">
      <input type="text" id="shop-create-name" maxlength="100" placeholder="Nome da nova lista (ex: Compras da semana)">
      <button type="submit" class="copy">Criar lista</button>
    </form>

    <p class="shop-empty" id="shop-empty" hidden>Ainda não há listas de compras. Cria a primeira.</p>

    <div class="shop-lists" id="shop-lists"></div>

  </div>

</div>

<div class="panel" id="day-panel" hidden></div>

<div class="panel" id="admin-panel" hidden></div>

<script type="module" src="./assets/app.js"></script>
</body>
</html>
